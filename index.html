<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Webperdictors — Launching Soon</title>
<style>
  :root {
    --bg-1: #0b0d17;
    --bg-2: #151a2e;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --text: #f4f5fb;
    --muted: #9aa0b4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 60vw;
    height: 60vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
  }
  .glow.one { background: var(--accent); top: -10%; left: -10%; }
  .glow.two { background: var(--accent-2); bottom: -15%; right: -10%; }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 640px;
    width: 100%;
    padding: 48px 32px;
  }

  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(124, 92, 255, 0.15);
    border: 1px solid rgba(124, 92, 255, 0.4);
    color: var(--accent-2);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin: 0 0 16px;
    background: linear-gradient(90deg, var(--text), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.sub {
    color: var(--muted);
    font-size: clamp(1rem, 2vw, 1.15rem);
    margin: 0 0 40px;
    line-height: 1.6;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .unit {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 18px 20px;
    min-width: 84px;
    backdrop-filter: blur(6px);
  }

  .unit .num {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .unit .label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .notify {
    display: flex;
    gap: 10px;
    max-width: 380px;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  .notify input {
    flex: 1;
    min-width: 200px;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }

  .notify input::placeholder { color: var(--muted); }

  .notify button {
    padding: 13px 22px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0b0d17;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .notify button:hover { transform: translateY(-1px); opacity: 0.92; }

  .status {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--accent-2);
    min-height: 1.2em;
  }

  footer {
    margin-top: 44px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card">
    <span class="badge">Under Construction</span>
    <h1>We're building something new.</h1>
    <p class="sub">Webperdictors is getting a fresh site. We're putting the finishing touches on it right now — check back soon.</p>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
    </div>

    <form class="notify" id="notify-form">
      <input type="email" id="email" placeholder="you@example.com" required />
      <button type="submit">Notify Me</button>
    </form>
    <div class="status" id="status"></div>

    <footer>&copy; <span id="year"></span> Webperdictors. Launching soon.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    var launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 3);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var now = new Date().getTime();
      var diff = launchDate.getTime() - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      var d = Math.floor(diff / (1000 * 60 * 60 * 24));
      var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = pad(d);
      document.getElementById('hours').textContent = pad(h);
      document.getElementById('minutes').textContent = pad(m);
      document.getElementById('seconds').textContent = pad(s);
    }

    tick();
    setInterval(tick, 1000);

    document.getElementById('notify-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var status = document.getElementById('status');
      try {
        var list = JSON.parse(localStorage.getItem('notifyList') || '[]');
        list.push({ email: email, at: new Date().toISOString() });
        localStorage.setItem('notifyList', JSON.stringify(list));
      } catch (err) {}
      status.textContent = "Thanks! We'll let you know when we launch.";
      document.getElementById('email').value = '';
    });
  </script>
</body>
</html>
